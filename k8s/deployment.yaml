apiVersion: apps/v1
kind: Deployment

metadata:
  name: project-3-app
  namespace: project-3

spec:
  replicas: 2

  selector:
    matchLabels:
      app: project-3

  template:
    metadata:
      labels:
        app: project-3

    spec:
      containers:
        - name: nginx
          image: girijos/k8s-project-3:v1
          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10  
          livenessProbe:
            httpGet:
              path: /a
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10